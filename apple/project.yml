name: Switchboard
options:
  bundleIdPrefix: ch.platret
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "3"
    PRODUCT_NAME: Switchboard
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Switchboard macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: Switchboard listens while you dictate a message to an agent.
        NSSpeechRecognitionUsageDescription: Switchboard turns what you say into the text of your message.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.platret.switchboard.mac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
  Switchboard iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Switchboard connects to the host on your Mac.
        NSMicrophoneUsageDescription: Switchboard listens while you dictate a message to an agent.
        NSSpeechRecognitionUsageDescription: Switchboard turns what you say into the text of your message.
        NSCameraUsageDescription: Switchboard uses the camera to scan the pairing code shown on your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.platret.switchboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  SwitchboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/Core
      - macOS/Core
      - Shared/Views/Chat/ChatEntry.swift
      - Shared/Views/Chat/ToolPresentation.swift
      - Shared/Views/Chat/MessageListMarker.swift
      - Shared/Views/Agents/AgentNaming.swift
      - Shared/Views/Design
      - Shared/Views/Support/Clipboard.swift
      - Shared/Views/Support/CopyButton.swift
      - Shared/Assets.xcassets
      - macOS/Onboarding
      - macOS/Window/PairingCode.swift
      - macOS/Settings/LaunchAtLoginToggle.swift
    settings:
      base:
        PRODUCT_NAME: SwitchboardTests
        PRODUCT_BUNDLE_IDENTIFIER: ch.platret.switchboard.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  Switchboard macOS:
    build:
      targets:
        Switchboard macOS: all
        SwitchboardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwitchboardTests
    archive:
      config: Release
  Switchboard iOS:
    build:
      targets:
        Switchboard iOS: all
    run:
      config: Debug
    archive:
      config: Release
